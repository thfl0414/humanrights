<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인권지수 데이터 탐구 웹앱</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons (대체 아이콘) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- PropTypes (Recharts의 UMD 의존성 추가) -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  
  <!-- Babel (JSX 컴파일러) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts (안정적인 버전으로 고정) -->
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
  
  <!-- Firebase Compat 라이브러리 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #f8fafc; }
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, ResponsiveContainer, Tooltip, Legend } = window.Recharts;

    // ==========================================
    // ⚠️ 개인 환경에서 실행 시 아래 설정을 채워주세요.
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBMD8w3CZuIHwd-9lclVY2uE0L-c_xRQt4",
      authDomain: "humanrights-8c05a.firebaseapp.com",
      databaseURL: "https://humanrights-8c05a-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "humanrights-8c05a",
      storageBucket: "humanrights-8c05a.firebasestorage.app",
      messagingSenderId: "639932009296",
      appId: "1:639932009296:web:0258436e082b7f219c3a55"
    };
    
    // 환경에 주입된 설정이 있다면 우선 사용
    const finalFirebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'hr-edu-app-default';
    
    // Realtime Database 경로에는 '.', '#', '$', '[', ']' 문자를 사용할 수 없으므로 안전한 문자로 치환합니다.
    const safeAppId = appId.replace(/[.#$\[\]]/g, '_');
    
    const GEMINI_API_KEY = ""; // 여기에 발급받은 Gemini API 키를 입력하세요.

    // Firebase 초기화 방어 로직 (설정이 없으면 오류 방지)
    let app, auth, db;
    try {
      if (Object.keys(finalFirebaseConfig).length > 0) {
        app = firebase.initializeApp(finalFirebaseConfig);
        auth = firebase.auth();
        db = firebase.database();
      }
    } catch (e) {
      console.warn("Firebase initialization skipped or failed:", e);
    }

    const COLLECTION_NAME = 'submissions';
    const INTRO_COLLECTION = 'intro_opinions';
    const TEACHER_PASSWORD = 'password123'; // 데모용 교사 비밀번호

    // 모의 인권 지수 데이터
    const COUNTRY_DATA = {
      "한국": { 언론자유: 70, 기아: 95, 성평등: 65, 노동권: 60, 평화: 75 },
      "미국": { 언론자유: 75, 기아: 90, 성평등: 75, 노동권: 50, 평화: 60 },
      "스웨덴": { 언론자유: 95, 기아: 98, 성평등: 95, 노동권: 90, 평화: 90 },
      "중국": { 언론자유: 20, 기아: 80, 성평등: 60, 노동권: 40, 평화: 55 },
      "소말리아": { 언론자유: 30, 기아: 20, 성평등: 30, 노동권: 25, 평화: 10 },
      "인도": { 언론자유: 40, 기아: 60, 성평등: 50, 노동권: 45, 평화: 40 },
      "독일": { 언론자유: 85, 기아: 95, 성평등: 85, 노동권: 85, 평화: 80 },
      "아프가니스탄": { 언론자유: 15, 기아: 10, 성평등: 10, 노동권: 15, 평화: 5 }
    };
    const COUNTRIES = Object.keys(COUNTRY_DATA);
    const INDICATORS = ['언론자유', '기아', '성평등', '노동권', '평화'];

    const generateGeminiFeedback = async (studentData) => {
      // 캔버스 환경에서 API 키 주입 호환성
      const apiKey = typeof window !== 'undefined' && window.__gemini_api_key ? window.__gemini_api_key : GEMINI_API_KEY;
      
      if (!apiKey) {
        return "API 키가 설정되지 않아 AI 피드백을 생성할 수 없습니다. 소스코드에 API 키를 입력해주세요.";
      }
      
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      const systemPrompt = `당신은 고등학교 1학년 통합사회 교사입니다. 학생이 제출한 '세계 인권지수 분석 및 공익 광고 기획' 과제를 평가하고 피드백을 작성해야 합니다.
성취기준: [10통사2-01-03] 사회적 소수자 차별 등 국내 인권 문제와 인권지수를 통해 확인할 수 있는 세계 인권 문제의 양상을 조사하고, 이에 대한 해결 방안을 모색한다.

학생 과제 데이터:
- 선택한 국가: ${studentData.countries?.join(', ')}
- 데이터 분석 노트: ${studentData.analysis}
- 공익 광고 기획: ${studentData.psa}
- 세계시민 다짐: ${studentData.pledge}

지시사항:
1. 학생의 노력을 칭찬하고 분석 내용을 구체적으로 언급하세요.
2. 성취기준과 평가기준에 비추어 잘한 점과 보완할 점을 3~4문장으로 작성하세요.
3. 교사가 검토 후 바로 학생에게 전달할 수 있도록 학생에게 직접 말하는 친절한 말투를 사용하세요.
4. 마크다운 기호 없이 순수 텍스트로만 출력하세요.`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "학생의 과제를 바탕으로 피드백 초안을 작성해주세요." }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          })
        });
        const result = await response.json();
        if (result.candidates && result.candidates.length > 0) {
          return result.candidates[0].content.parts[0].text;
        }
        throw new Error("AI 응답을 생성하지 못했습니다.");
      } catch (error) {
        console.error("Gemini API Error:", error);
        return "AI 피드백 생성 중 오류가 발생했습니다.";
      }
    };

    const downloadCSV = (data) => {
      if (!data || data.length === 0) return;
      const headers = ['이름', '학번', '선택국가', '데이터분석', '공익광고기획', '세계시민다짐', '교사피드백', '제출일시'];
      const csvRows = [headers.join(',')];
      data.forEach(row => {
        const values = [
          row.studentName || '',
          row.studentId || '',
          (row.countries || []).join(' / '),
          `"${(row.analysis || '').replace(/"/g, '""')}"`,
          `"${(row.psa || '').replace(/"/g, '""')}"`,
          `"${(row.pledge || '').replace(/"/g, '""')}"`,
          `"${(row.teacherFeedback || '').replace(/"/g, '""')}"`,
          row.createdAt ? new Date(row.createdAt).toLocaleString() : ''
        ];
        csvRows.push(values.join(','));
      });
      const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' }); 
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `인권지수_수업결과_${new Date().getTime()}.csv`;
      link.click();
    };

    const downloadHTMLReport = (data) => {
      if (!data || data.length === 0) return;
      let htmlContent = `
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="UTF-8">
          <title>인권지수 탐구 과제 제출 결과</title>
          <style>
            body { font-family: 'Malgun Gothic', sans-serif; background: #f8fafc; padding: 20px; line-height: 1.6; }
            .container { max-width: 1000px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; }
            h1 { color: #1e3a8a; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; }
            .student-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 30px; background: #f8fafc; page-break-inside: avoid; }
            .student-header { font-weight: bold; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; margin-bottom: 15px; }
            .section-title { font-weight: bold; color: #2563eb; margin-bottom: 8px; }
            .content-box { background: white; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; white-space: pre-wrap; font-size: 0.95em; margin-bottom: 15px; }
            .feedback { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
          </style>
        </head>
        <body>
          <div class="container">
            <h1>통합사회 - 세계 인권지수 탐구 과제</h1>
      `;
      data.forEach(row => {
        htmlContent += `
            <div class="student-card">
              <div class="student-header">학번: ${row.studentId || ''} | 이름: ${row.studentName || ''} | 선택 국가: ${row.countries?.join(', ') || ''}</div>
              <div class="section-title">📊 데이터 분석 노트</div><div class="content-box">${(row.analysis || '')}</div>
              <div class="section-title">💡 공익 광고 기획안</div><div class="content-box">${(row.psa || '')}</div>
              <div class="section-title">🌍 세계시민 다짐</div><div class="content-box">"${(row.pledge || '')}"</div>
              ${row.teacherFeedback ? `<div class="section-title">📝 교사 피드백</div><div class="content-box feedback">${row.teacherFeedback}</div>` : ''}
            </div>`;
      });
      htmlContent += `</div></body></html>`;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' }); 
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `인권지수_보고서_${new Date().getTime()}.html`;
      link.click();
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div className="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
              <h3 className="text-xl font-bold">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700">
                <i className="fas fa-times text-xl"></i>
              </button>
            </div>
            <div className="p-6 overflow-y-auto flex-1">{children}</div>
          </div>
        </div>
      );
    };

    const TeacherLogin = ({ setView }) => {
      const [pwd, setPwd] = useState('');
      const [error, setError] = useState(false);
      const handleLogin = (e) => {
        e.preventDefault();
        if (pwd === TEACHER_PASSWORD) setView('teacher_dashboard');
        else setError(true);
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
            <div className="flex justify-center mb-6 text-amber-500"><i className="fas fa-lock text-4xl bg-amber-100 p-4 rounded-full"></i></div>
            <h2 className="text-2xl font-bold text-center mb-6">교사 인증</h2>
            <form onSubmit={handleLogin} className="space-y-4">
              <input type="password" value={pwd} onChange={(e) => { setPwd(e.target.value); setError(false); }} className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-amber-500" placeholder="비밀번호" />
              {error && <p className="text-red-500 text-sm">비밀번호가 일치하지 않습니다.</p>}
              <button type="submit" className="w-full bg-amber-600 text-white py-3 rounded-lg font-bold">대시보드 입장</button>
              <button type="button" onClick={() => setView('student')} className="w-full bg-slate-100 py-3 rounded-lg font-medium mt-2">학생 화면으로 돌아가기</button>
            </form>
          </div>
        </div>
      );
    };

    const TeacherDashboard = ({ submissions, setView }) => {
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [feedbackText, setFeedbackText] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      const openModal = (student) => { setSelectedStudent(student); setFeedbackText(student.teacherFeedback || ''); setIsModalOpen(true); };
      
      const handleGenerateAI = async () => {
        setIsGenerating(true);
        setFeedbackText(await generateGeminiFeedback(selectedStudent));
        setIsGenerating(false);
      };

      const handleSaveFeedback = async () => {
        if (!db) return alert('데이터베이스 연결이 없습니다.');
        try {
          await db.ref(`artifacts/${safeAppId}/public/data/${COLLECTION_NAME}/${selectedStudent.id}`).update({ teacherFeedback: feedbackText });
          setIsModalOpen(false);
        } catch (error) { console.error(error); alert("저장 실패"); }
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <header className="bg-indigo-900 text-white p-6 flex justify-between items-center">
            <h1 className="text-2xl font-bold flex items-center gap-2"><i className="fas fa-chalkboard-teacher"></i> 교사용 대시보드</h1>
            <div className="flex gap-2">
              <button onClick={() => downloadHTMLReport(submissions)} className="bg-blue-600 px-3 py-2 rounded-lg text-sm font-medium"><i className="fas fa-file-alt"></i> HTML 다운로드</button>
              <button onClick={() => downloadCSV(submissions)} className="bg-indigo-700 px-3 py-2 rounded-lg text-sm font-medium"><i className="fas fa-download"></i> CSV 다운로드</button>
              <button onClick={() => setView('student')} className="bg-slate-700 px-3 py-2 rounded-lg text-sm font-medium">학생화면으로</button>
            </div>
          </header>
          <main className="p-6 max-w-7xl mx-auto w-full">
            <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
              <table className="w-full text-left">
                <thead className="bg-slate-100 text-sm">
                  <tr><th className="p-4 border-b">학번/이름</th><th className="p-4 border-b">선택 국가</th><th className="p-4 border-b text-center">상태</th><th className="p-4 border-b text-center">관리</th></tr>
                </thead>
                <tbody>
                  {submissions.map(sub => (
                    <tr key={sub.id} className="border-b hover:bg-slate-50">
                      <td className="p-4 font-bold">{sub.studentName} <span className="text-sm font-normal text-slate-500">({sub.studentId})</span></td>
                      <td className="p-4 text-sm">{sub.countries?.join(', ')}</td>
                      <td className="p-4 text-center text-xs font-bold">
                        {sub.teacherFeedback ? <span className="text-green-600 bg-green-100 px-2 py-1 rounded"><i className="fas fa-check"></i> 작성완료</span> : <span className="text-amber-600 bg-amber-100 px-2 py-1 rounded"><i className="fas fa-exclamation"></i> 미작성</span>}
                      </td>
                      <td className="p-4 text-center"><button onClick={() => openModal(sub)} className="bg-blue-50 text-blue-600 px-3 py-1 rounded text-sm font-bold">피드백</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </main>
          <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={`피드백 (${selectedStudent?.studentName})`}>
            {selectedStudent && (
              <div className="grid md:grid-cols-2 gap-6">
                <div className="space-y-4">
                  <div className="bg-slate-50 p-3 rounded text-sm whitespace-pre-wrap"><span className="font-bold">분석:</span><br/>{selectedStudent.analysis}</div>
                  <div className="bg-slate-50 p-3 rounded text-sm whitespace-pre-wrap"><span className="font-bold">광고:</span><br/>{selectedStudent.psa}</div>
                </div>
                <div className="flex flex-col h-full">
                  <button onClick={handleGenerateAI} disabled={isGenerating} className="mb-2 bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2">
                    {isGenerating ? <i className="fas fa-sync-alt fa-spin"></i> : <i className="fas fa-robot"></i>} AI 초안 생성
                  </button>
                  <textarea value={feedbackText} onChange={e => setFeedbackText(e.target.value)} className="flex-1 border p-3 rounded-lg mb-4 min-h-[200px]" placeholder="피드백 작성..." />
                  <button onClick={handleSaveFeedback} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">저장하기</button>
                </div>
              </div>
            )}
          </Modal>
        </div>
      );
    };

    const StudentView = ({ user, submissions, introOpinions, setView }) => {
      const [step, setStep] = useState(0);
      const [studentName, setStudentName] = useState('');
      const [studentId, setStudentId] = useState('');
      const [introOpinion, setIntroOpinion] = useState('');
      const [selectedCountries, setSelectedCountries] = useState([]);
      
      const [analysis1, setAnalysis1] = useState(''); const [analysis2, setAnalysis2] = useState(''); const [analysis3, setAnalysis3] = useState('');
      const [psaTarget, setPsaTarget] = useState(''); const [psaSocial, setPsaSocial] = useState(''); const [psaPersonal, setPsaPersonal] = useState(''); const [psaSlogan, setPsaSlogan] = useState(''); const [psaVisuals, setPsaVisuals] = useState('');
      const [pledge, setPledge] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const mySubmission = submissions.find(s => s.uid === (user?.uid || 'local_user'));
      const [isEditing, setIsEditing] = useState(false);

      const handleOpinionSubmit = async () => {
        if (!studentName || !introOpinion.trim()) return;
        if(db) {
          await db.ref(`artifacts/${safeAppId}/public/data/${INTRO_COLLECTION}`).push({
            uid: user?.uid || 'local_user', studentName, studentId, opinion: introOpinion, createdAt: Date.now()
          });
        }
        setIntroOpinion('');
      };

      const handleSubmit = async () => {
        if(selectedCountries.length === 0) return;
        setIsSubmitting(true);
        const data = {
          uid: user?.uid || 'local_user', studentName, studentId, countries: selectedCountries,
          analysis: `[국가 간 차이]\n${analysis1}\n\n[상관관계]\n${analysis2}\n\n[원인추론]\n${analysis3}`,
          psa: `[타겟]\n${psaTarget}\n\n[사회적]\n${psaSocial}\n\n[개인적]\n${psaPersonal}\n\n[슬로건]\n${psaSlogan}\n\n[시각]\n${psaVisuals}`,
          pledge, createdAt: Date.now()
        };
        try {
          if (db) {
            const ref = db.ref(`artifacts/${safeAppId}/public/data/${COLLECTION_NAME}`);
            if (mySubmission && isEditing) await ref.child(mySubmission.id).update(data);
            else await ref.push(data);
          } else {
            alert("저장되었습니다! (단, Firebase 연결이 없어 브라우저를 닫으면 사라집니다)");
          }
          setIsEditing(false);
        } catch(e) { console.error(e); }
        setIsSubmitting(false);
      };

      const renderChart = () => {
        const data = INDICATORS.map(ind => {
          let pt = { subject: ind };
          selectedCountries.forEach(c => pt[c] = COUNTRY_DATA[c][ind]);
          return pt;
        });
        const colors = ['#8884d8', '#82ca9d', '#ffc658'];
        return (
          <div className="bg-white p-6 rounded-2xl border mb-6 items-center">
            <h3 className="text-lg font-bold text-center mb-4"><i className="fas fa-chart-pie text-blue-500"></i> 인권지수 비교 (높을수록 좋음)</h3>
            <div className="h-64 w-full">
              <ResponsiveContainer>
                <RadarChart data={data}>
                  <PolarGrid />
                  <PolarAngleAxis dataKey="subject" />
                  <PolarRadiusAxis angle={30} domain={[0, 100]} />
                  <Tooltip />
                  <Legend />
                  {selectedCountries.map((c, i) => <Radar key={c} name={c} dataKey={c} stroke={colors[i]} fill={colors[i]} fillOpacity={0.5} />)}
                </RadarChart>
              </ResponsiveContainer>
            </div>
          </div>
        );
      };

      if (mySubmission && !isEditing) {
        return (
          <div className="max-w-2xl mx-auto p-6 mt-10 bg-white rounded-xl shadow-md text-center">
            <i className="fas fa-check-circle text-green-500 text-6xl mb-4"></i>
            <h2 className="text-2xl font-bold mb-4">제출 완료!</h2>
            <div className="bg-slate-50 p-4 rounded text-left border mb-6">
              <h3 className="font-bold border-b pb-2 mb-2"><i className="fas fa-comment-dots text-blue-500"></i> 교사 피드백</h3>
              {mySubmission.teacherFeedback ? <p className="text-blue-900 whitespace-pre-wrap">{mySubmission.teacherFeedback}</p> : <p className="text-slate-400 text-center py-4">피드백 대기중...</p>}
            </div>
            <button onClick={() => setIsEditing(true)} className="border px-4 py-2 rounded font-bold text-slate-600 hover:bg-slate-50">수정하기</button>
            <button onClick={() => setView('teacher_login')} className="ml-4 text-slate-400 text-sm">교사모드</button>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto py-8 px-4 space-y-6">
          <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <h2 className="text-xl font-bold"><i className="fas fa-globe-asia text-blue-600"></i> 세계 인권지수 탐구</h2>
            <button onClick={() => setView('teacher_login')} className="text-slate-400 text-sm"><i className="fas fa-lock"></i> 교사</button>
          </div>

          <div className="bg-white p-6 rounded-xl shadow-md">
            {step === 0 && (
              <div className="space-y-6">
                <div className="bg-blue-50 p-4 border-l-4 border-blue-500 rounded text-sm text-slate-700">
                  <span className="font-bold text-blue-900 mb-1 block">📌 탐구 질문</span>
                  세계 여러 나라의 인권지수는 어떤 차이를 보이며, 격차를 줄이기 위해 어떻게 협력해야 할까?
                </div>
                <div className="flex gap-4">
                  <input type="text" placeholder="학번" value={studentId} onChange={e=>setStudentId(e.target.value)} className="border p-2 rounded flex-1"/>
                  <input type="text" placeholder="이름" value={studentName} onChange={e=>setStudentName(e.target.value)} className="border p-2 rounded flex-1"/>
                </div>
                <div className="border p-4 rounded bg-slate-50 text-center">
                  <p className="mb-2 font-bold">🤔 이 지도는 무엇을 나타낼까요?</p>
                  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Press_freedom_2023.svg/1024px-Press_freedom_2023.svg.png" className="max-w-full rounded mb-4 shadow" alt="세계 지도"/>
                  <div className="flex gap-2">
                    <input type="text" value={introOpinion} onChange={e=>setIntroOpinion(e.target.value)} placeholder="색깔 차이의 의미를 유추해보세요" className="border p-2 rounded flex-1"/>
                    <button onClick={handleOpinionSubmit} className="bg-blue-600 text-white px-4 py-2 rounded">등록</button>
                  </div>
                </div>
                <button onClick={() => setStep(1)} disabled={!studentName} className="w-full bg-indigo-600 text-white py-3 rounded font-bold disabled:bg-slate-300">탐구 시작하기</button>
              </div>
            )}
            {step === 1 && (
              <div className="space-y-4">
                <h3 className="font-bold text-lg">국가 선택 (최대 3개)</h3>
                <div className="flex flex-wrap gap-2">
                  {COUNTRIES.map(c => (
                    <button key={c} onClick={() => {
                      if (selectedCountries.includes(c)) setSelectedCountries(selectedCountries.filter(x => x !== c));
                      else if (selectedCountries.length < 3) setSelectedCountries([...selectedCountries, c]);
                    }} className={`px-4 py-2 rounded-full font-bold ${selectedCountries.includes(c) ? 'bg-blue-600 text-white' : 'bg-slate-100 hover:bg-slate-200'}`}>
                      {c}
                    </button>
                  ))}
                </div>
                <div className="flex justify-end gap-2 pt-4">
                  <button onClick={()=>setStep(0)} className="px-4 py-2 bg-slate-100 rounded font-bold">이전</button>
                  <button onClick={()=>setStep(2)} disabled={selectedCountries.length<2} className="px-4 py-2 bg-blue-600 text-white rounded font-bold disabled:bg-slate-300">다음</button>
                </div>
              </div>
            )}
            {step === 2 && (
              <div className="space-y-4">
                {renderChart()}
                <div className="bg-blue-50 p-4 rounded space-y-4">
                  <h3 className="font-bold text-blue-900">데이터 분석</h3>
                  <textarea value={analysis1} onChange={e=>setAnalysis1(e.target.value)} placeholder="1. 가장 큰 차이를 보이는 지수는?" className="w-full p-2 border rounded"/>
                  <textarea value={analysis2} onChange={e=>setAnalysis2(e.target.value)} placeholder="2. 두 지수 간의 연관성(패턴)은?" className="w-full p-2 border rounded"/>
                  <textarea value={analysis3} onChange={e=>setAnalysis3(e.target.value)} placeholder="3. 이러한 차이가 나타나는 구조적 원인은?" className="w-full p-2 border rounded"/>
                </div>
                <div className="flex justify-between pt-4">
                  <button onClick={()=>setStep(1)} className="px-4 py-2 bg-slate-100 rounded font-bold">이전</button>
                  <button onClick={()=>setStep(3)} className="px-4 py-2 bg-blue-600 text-white rounded font-bold">다음</button>
                </div>
              </div>
            )}
            {step === 3 && (
              <div className="space-y-4">
                <div className="bg-amber-50 p-4 rounded space-y-4">
                  <h3 className="font-bold text-amber-900">공익 광고 기획안 작성</h3>
                  <input type="text" value={psaTarget} onChange={e=>setPsaTarget(e.target.value)} placeholder="1. 광고 타겟" className="w-full p-2 border rounded"/>
                  <textarea value={psaSocial} onChange={e=>setPsaSocial(e.target.value)} placeholder="2. 사회적 차원 해결방안 (제도, 협력)" className="w-full p-2 border rounded"/>
                  <textarea value={psaPersonal} onChange={e=>setPsaPersonal(e.target.value)} placeholder="3. 개인적 차원 해결방안 (실천)" className="w-full p-2 border rounded"/>
                  <input type="text" value={psaSlogan} onChange={e=>setPsaSlogan(e.target.value)} placeholder="4. 핵심 슬로건" className="w-full p-2 border rounded"/>
                  <textarea value={psaVisuals} onChange={e=>setPsaVisuals(e.target.value)} placeholder="5. 시각적 장면 구성" className="w-full p-2 border rounded"/>
                </div>
                <input type="text" value={pledge} onChange={e=>setPledge(e.target.value)} placeholder="나의 세계시민 실천 다짐 한 줄!" className="w-full p-3 border-2 border-emerald-300 rounded font-bold text-center"/>
                <div className="flex justify-between pt-4">
                  <button onClick={()=>setStep(2)} className="px-4 py-2 bg-slate-100 rounded font-bold">이전</button>
                  <button onClick={handleSubmit} disabled={isSubmitting} className="px-8 py-2 bg-indigo-600 text-white rounded font-bold shadow-md">
                    {isSubmitting ? '제출 중...' : '최종 제출'}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [view, setView] = useState('student');
      const [submissions, setSubmissions] = useState([]);
      const [introOpinions, setIntroOpinions] = useState([]);

      // 1. 로그인 (인증) 처리 상태 관리
      useEffect(() => {
        if (!auth) return;
        auth.signInAnonymously().catch(console.error);
        const unsubAuth = auth.onAuthStateChanged(u => setUser(u));
        return () => unsubAuth();
      }, []);

      // 2. 로그인이 확인된 이후에만 데이터베이스 연동 시작
      useEffect(() => {
        if (!db || !user) return; // user(로그인 정보)가 없으면 대기
        
        const subRef = db.ref(`artifacts/${safeAppId}/public/data/${COLLECTION_NAME}`);
        const handleSub = (snap) => {
          const val = snap.val();
          const list = val ? Object.keys(val).map(k => ({id: k, ...val[k]})) : [];
          setSubmissions(list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)));
        };
        subRef.on('value', handleSub, error => console.warn("Submissions 가져오기 실패:", error));
        
        const introRef = db.ref(`artifacts/${safeAppId}/public/data/${INTRO_COLLECTION}`);
        const handleIntro = (snap) => {
          const val = snap.val();
          const list = val ? Object.keys(val).map(k => ({id: k, ...val[k]})) : [];
          setIntroOpinions(list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)));
        };
        introRef.on('value', handleIntro, error => console.warn("Intro 의견 가져오기 실패:", error));

        return () => { 
          subRef.off('value', handleSub); 
          introRef.off('value', handleIntro); 
        };
      }, [user]); // user 상태가 변경될 때마다 실행

      return (
        <div>
          {view === 'student' && <StudentView user={user} submissions={submissions} introOpinions={introOpinions} setView={setView} />}
          {view === 'teacher_login' && <TeacherLogin setView={setView} />}
          {view === 'teacher_dashboard' && <TeacherDashboard submissions={submissions} setView={setView} />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
