<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세계 인권지수 탐구 (학생용)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- PropTypes (Recharts 의존성 해결) -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts (안정화 버전 고정) -->
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
  
  <!-- Firebase Compat (Realtime Database 용) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #f8fafc; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, ResponsiveContainer, Tooltip, Legend } = window.Recharts;

    // 선생님의 Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyBMD8w3CZuIHwd-9lclVY2uE0L-c_xRQt4",
      authDomain: "humanrights-8c05a.firebaseapp.com",
      projectId: "humanrights-8c05a",
      storageBucket: "humanrights-8c05a.firebasestorage.app",
      messagingSenderId: "639932009296",
      appId: "1:639932009296:web:0258436e082b7f219c3a55",
      databaseURL: "https://humanrights-8c05a-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    // Firebase 앱 초기화 방어 로직
    let app, auth, db;
    if (!firebase.apps.length) {
      app = firebase.initializeApp(firebaseConfig);
    } else {
      app = firebase.app();
    }
    auth = firebase.auth();
    db = firebase.database();

    // 데이터베이스 저장 경로 (특수문자 문제 방지를 위해 고정된 문자열 사용)
    const DB_PATH = "humanrights_data_v2";

    const COUNTRY_DATA = {
      "한국": { 언론자유: 70, 기아: 95, 성평등: 65, 노동권: 60, 평화: 75 },
      "미국": { 언론자유: 75, 기아: 90, 성평등: 75, 노동권: 50, 평화: 60 },
      "스웨덴": { 언론자유: 95, 기아: 98, 성평등: 95, 노동권: 90, 평화: 90 },
      "중국": { 언론자유: 20, 기아: 80, 성평등: 60, 노동권: 40, 평화: 55 },
      "소말리아": { 언론자유: 30, 기아: 20, 성평등: 30, 노동권: 25, 평화: 10 },
      "인도": { 언론자유: 40, 기아: 60, 성평등: 50, 노동권: 45, 평화: 40 },
      "독일": { 언론자유: 85, 기아: 95, 성평등: 85, 노동권: 85, 평화: 80 },
      "아프가니스탄": { 언론자유: 15, 기아: 10, 성평등: 10, 노동권: 15, 평화: 5 }
    };
    const COUNTRIES = Object.keys(COUNTRY_DATA);
    const INDICATORS = ['언론자유', '기아', '성평등', '노동권', '평화'];

    const App = () => {
      const [user, setUser] = useState(null);
      const [introOpinions, setIntroOpinions] = useState([]);
      const [mySubmission, setMySubmission] = useState(null);
      
      const [step, setStep] = useState(0);
      const [studentId, setStudentId] = useState('');
      const [studentName, setStudentName] = useState('');
      
      // Step 0: 도입부
      const [introOpinion, setIntroOpinion] = useState('');
      const [isSubmittingOpinion, setIsSubmittingOpinion] = useState(false);
      
      // Step 1: 국가 선택
      const [selectedCountries, setSelectedCountries] = useState([]);
      
      // Step 2: 데이터 분석 노트 (세분화)
      const [analysis1, setAnalysis1] = useState('');
      const [analysis2, setAnalysis2] = useState('');
      const [analysis3, setAnalysis3] = useState('');
      
      // Step 3: 공익 광고 기획 (세분화)
      const [psaTarget, setPsaTarget] = useState('');
      const [psaSocial, setPsaSocial] = useState('');
      const [psaPersonal, setPsaPersonal] = useState('');
      const [psaSlogan, setPsaSlogan] = useState('');
      const [psaVisuals, setPsaVisuals] = useState('');
      const [pledge, setPledge] = useState('');
      
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isEditing, setIsEditing] = useState(false);

      // 인증 처리
      useEffect(() => {
        auth.signInAnonymously().catch(console.error);
        const unsub = auth.onAuthStateChanged(u => {
          if (u) setUser(u);
        });
        return () => unsub();
      }, []);

      // 실시간 데이터 구독 (로그인 완료 후 실행)
      useEffect(() => {
        if (!user) return;
        
        // 도입부 의견 구독
        const introRef = db.ref(`${DB_PATH}/intro_opinions`);
        introRef.on('value', snap => {
          const val = snap.val();
          if (val) {
            const list = Object.keys(val).map(k => ({ id: k, ...val[k] })).sort((a, b) => b.createdAt - a.createdAt);
            setIntroOpinions(list);
          }
        });

        // 내 제출물 확인
        const subRef = db.ref(`${DB_PATH}/submissions`);
        subRef.orderByChild('uid').equalTo(user.uid).on('value', snap => {
          const val = snap.val();
          if (val) {
            const id = Object.keys(val)[0];
            setMySubmission({ id, ...val[id] });
          } else {
            setMySubmission(null);
          }
        });

        return () => { introRef.off(); subRef.off(); };
      }, [user]);

      const handleEditClick = () => {
        if (!mySubmission) return;
        setStudentId(mySubmission.studentId || '');
        setStudentName(mySubmission.studentName || '');
        setSelectedCountries(mySubmission.countries || []);
        
        const raw = mySubmission.rawFields || {};
        setAnalysis1(raw.analysis1 || ''); setAnalysis2(raw.analysis2 || ''); setAnalysis3(raw.analysis3 || '');
        setPsaTarget(raw.psaTarget || ''); setPsaSocial(raw.psaSocial || ''); setPsaPersonal(raw.psaPersonal || ''); 
        setPsaSlogan(raw.psaSlogan || ''); setPsaVisuals(raw.psaVisuals || '');
        setPledge(mySubmission.pledge || '');
        
        setIsEditing(true);
        setStep(1); // 수정 시 국가 선택 화면으로 바로 이동
      };

      const handleOpinionSubmit = async () => {
        if (!studentName || !studentId || !introOpinion.trim()) return;
        setIsSubmittingOpinion(true);
        try {
          await db.ref(`${DB_PATH}/intro_opinions`).push({
            uid: user.uid, studentId, studentName, opinion: introOpinion, createdAt: Date.now()
          });
          setIntroOpinion('');
        } catch(e) { console.error(e); }
        setIsSubmittingOpinion(false);
      };

      const handleSubmit = async () => {
        if (selectedCountries.length < 2 || !analysis1 || !psaTarget || !pledge) return;
        setIsSubmitting(true);
        
        const payload = {
          uid: user.uid, studentId, studentName, countries: selectedCountries,
          rawFields: { analysis1, analysis2, analysis3, psaTarget, psaSocial, psaPersonal, psaSlogan, psaVisuals },
          pledge, createdAt: Date.now()
        };

        try {
          if (mySubmission && isEditing) {
            await db.ref(`${DB_PATH}/submissions/${mySubmission.id}`).update(payload);
            setIsEditing(false);
          } else {
            await db.ref(`${DB_PATH}/submissions`).push(payload);
          }
        } catch (e) { alert("제출 중 오류가 발생했습니다."); console.error(e); }
        setIsSubmitting(false);
      };

      const getChartData = () => {
        return INDICATORS.map(ind => {
          const pt = { subject: ind };
          selectedCountries.forEach(c => { pt[c] = COUNTRY_DATA[c][ind]; });
          return pt;
        });
      };

      if (mySubmission && !isEditing) {
        return (
          <div className="min-h-screen bg-slate-50 py-8 px-4">
            <div className="max-w-3xl mx-auto space-y-6">
              <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
                <h2 className="text-xl font-bold"><i className="fas fa-check-circle text-green-500"></i> 제출 완료</h2>
                {/* 교사 모드 버튼 삭제됨 */}
              </div>
              
              <div className="bg-white p-8 rounded-2xl shadow-md border-t-4 border-green-500 text-center">
                <h3 className="text-2xl font-bold mb-2">과제가 성공적으로 제출되었습니다!</h3>
                <p className="text-slate-600 mb-6">선생님의 피드백을 기다려주세요.</p>
                
                <div className="bg-slate-50 rounded-xl p-6 text-left border mb-6">
                  <h4 className="font-bold border-b pb-2 mb-4"><i className="fas fa-comment-dots text-blue-500"></i> 선생님의 피드백</h4>
                  {mySubmission.teacherFeedback ? (
                    <div className="bg-blue-50 p-4 rounded-lg text-blue-900 whitespace-pre-wrap leading-relaxed">{mySubmission.teacherFeedback}</div>
                  ) : (
                    <p className="text-center text-slate-400 py-4"><i className="fas fa-spinner fa-spin"></i> 피드백을 작성 중입니다...</p>
                  )}
                </div>
                
                <button onClick={handleEditClick} className="bg-white border-2 border-slate-200 px-6 py-2 rounded-xl font-bold hover:bg-slate-50 shadow-sm transition-colors">
                  <i className="fas fa-edit"></i> 제출한 내용 다시 수정하기
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 py-4 sm:py-8 px-4">
          <div className="max-w-4xl mx-auto space-y-6">
            <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
              <h2 className="text-xl font-bold"><i className="fas fa-globe-asia text-blue-600"></i> [통합사회] 세계 인권지수 탐구</h2>
              {/* 교사 모드 버튼 삭제됨 */}
            </div>

            <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
              {/* 스텝 바 */}
              {step > 0 && (
                <div className="flex border-b bg-slate-50">
                  {['국가선택', '데이터 분석', '광고 기획 & 다짐'].map((label, idx) => (
                    <div key={idx} className={`flex-1 py-4 text-center font-bold text-sm ${step === idx + 1 ? 'bg-blue-600 text-white' : step > idx + 1 ? 'text-blue-600' : 'text-slate-400'}`}>
                      {idx + 1}. {label}
                    </div>
                  ))}
                </div>
              )}

              <div className="p-4 sm:p-8">
                {}
                {step === 0 && (
                  <div className="space-y-6">
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-5 rounded">
                      <h3 className="font-bold text-blue-900 mb-2"><i className="fas fa-flag"></i> 학습 목표 확인</h3>
                      <p className="text-sm mb-1"><b>[성취기준]</b> 10통사2-01-03 사회적 소수자 차별 등 국내 인권 문제와 인권지수를 통해 확인할 수 있는 세계 인권 문제의 양상을 조사하고, 이에 대한 해결 방안을 모색한다.</p>
                      <p className="text-sm"><b>[탐구질문]</b> 세계 여러 나라의 인권지수는 어떤 차이를 보이며, 이러한 격차를 줄이기 위해 국제 사회는 어떻게 협력해야 할까?</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <input type="text" placeholder="학번 (예: 10101)" value={studentId} onChange={e=>setStudentId(e.target.value)} className="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"/>
                      <input type="text" placeholder="이름 (예: 홍길동)" value={studentName} onChange={e=>setStudentName(e.target.value)} className="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"/>
                    </div>

                    <div className="bg-white p-4 rounded-xl border shadow-sm">
                      <h4 className="font-bold mb-2"><i className="fas fa-search"></i> 이 지도는 무엇을 나타낼까요?</h4>
                      <p className="text-sm text-slate-600 mb-4">국가별로 색깔이 다르게 칠해진 이유와 의미를 유추하여 친구들과 의견을 나눠봅시다.</p>
                      
                      {/* 이미지 파일 경로가 ./map.png 로 수정되었습니다. */}
                      <img src="./map.png" alt="의문의 세계 지도" className="w-full rounded mb-4"/>
                      
                      <div className="flex gap-2">
                        <input type="text" value={introOpinion} onChange={e=>setIntroOpinion(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleOpinionSubmit()} placeholder="어떤 의미의 지도일까요? 유추한 내용을 적어보세요" disabled={!studentName} className="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"/>
                        <button onClick={handleOpinionSubmit} disabled={!studentName || !introOpinion || isSubmittingOpinion} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">등록</button>
                      </div>
                    </div>

                    <div className="bg-slate-50 p-4 rounded border h-48 overflow-y-auto">
                      <h4 className="font-bold mb-3 text-sm text-slate-600"><i className="fas fa-comments"></i> 친구들의 의견</h4>
                      {introOpinions.map(op => (
                        <div key={op.id} className="bg-white p-2 mb-2 rounded shadow-sm text-sm">
                          <span className="font-bold text-blue-800 mr-2">{op.studentId} {op.studentName}</span> {op.opinion}
                        </div>
                      ))}
                    </div>

                    <button onClick={() => setStep(1)} disabled={!studentName || !studentId} className="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold disabled:bg-slate-300">
                      탐구 시작하기 (국가 선택)
                    </button>
                  </div>
                )}

                {}
                {step === 1 && (
                  <div className="space-y-6">
                    <h3 className="font-bold mb-2">비교 분석할 국가를 선택하세요 (2~3개)</h3>
                    <div className="flex flex-wrap gap-3">
                      {COUNTRIES.map(c => {
                        const isSelected = selectedCountries.includes(c);
                        return (
                          <button key={c} onClick={() => {
                            if(isSelected) setSelectedCountries(selectedCountries.filter(x => x !== c));
                            else if(selectedCountries.length < 3) setSelectedCountries([...selectedCountries, c]);
                          }} className={`px-4 py-2 rounded-full font-bold ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 hover:bg-slate-200'}`}>
                            {c}
                          </button>
                        );
                      })}
                    </div>
                    <div className="flex justify-between pt-4 border-t">
                      <button onClick={()=>setStep(0)} className="px-6 py-2 bg-slate-100 rounded-lg font-bold">이전</button>
                      <button onClick={()=>setStep(2)} disabled={selectedCountries.length < 2} className="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold disabled:bg-slate-300">다음 단계</button>
                    </div>
                  </div>
                )}

                {}
                {step === 2 && (
                  <div className="space-y-6">
                    <div className="h-80 w-full bg-slate-50 rounded border flex flex-col items-center justify-center p-4">
                      <ResponsiveContainer width="100%" height="100%">
                        {/* outerRadius를 줄여 범례(Legend)와 겹치지 않게 수정 */}
                        <RadarChart outerRadius="70%" data={getChartData()}>
                          <PolarGrid />
                          <PolarAngleAxis dataKey="subject" />
                          <PolarRadiusAxis angle={30} domain={[0, 100]} />
                          {/* 툴팁과 범례 활성화 */}
                          <Tooltip contentStyle={{ borderRadius: '8px' }} />
                          <Legend wrapperStyle={{ paddingTop: '20px' }} />
                          {selectedCountries.map((c, i) => (
                            <Radar key={c} name={c} dataKey={c} stroke={['#8884d8', '#82ca9d', '#ffc658'][i]} fill={['#8884d8', '#82ca9d', '#ffc658'][i]} fillOpacity={0.5} />
                          ))}
                        </RadarChart>
                      </ResponsiveContainer>
                    </div>
                    
                    <div className="space-y-4">
                      <div>
                        <label className="font-bold text-blue-900 block mb-1">1. 국가 간 지수 비교 (차이점 분석)</label>
                        <textarea value={analysis1} onChange={e=>setAnalysis1(e.target.value)} placeholder="어떤 지수에서 국가 간 격차가 가장 크게 나타나나요?" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
                      </div>
                      <div>
                        <label className="font-bold text-blue-900 block mb-1">2. 지수 간 상관관계 (패턴 찾기)</label>
                        <textarea value={analysis2} onChange={e=>setAnalysis2(e.target.value)} placeholder="예: 언론자유가 높은 국가는 노동권 지수도 높은 경향이 있다." className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
                      </div>
                      <div>
                        <label className="font-bold text-blue-900 block mb-1">3. 구조적 원인 추론</label>
                        <textarea value={analysis3} onChange={e=>setAnalysis3(e.target.value)} placeholder="위와 같은 인권 지수의 차이와 연관성이 나타나는 사회적, 구조적 원인은 무엇일까요?" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
                      </div>
                    </div>

                    <div className="flex justify-between pt-4 border-t">
                      <button onClick={()=>setStep(1)} className="px-6 py-2 bg-slate-100 rounded-lg font-bold">이전</button>
                      <button onClick={()=>setStep(3)} className="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold">다음 단계</button>
                    </div>
                  </div>
                )}

                {}
                {step === 3 && (
                  <div className="space-y-6">
                    <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 space-y-4">
                      <h3 className="font-bold text-amber-900"><i className="fas fa-lightbulb"></i> 공익 광고 기획안 (Canva 제작용 스토리보드)</h3>
                      <input type="text" placeholder="1. 광고 타겟 대상 (예: 전 세계 청소년, 선진국 정부 등)" value={psaTarget} onChange={e=>setPsaTarget(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500"/>
                      <textarea placeholder="2. 사회적 차원 해결방안 (법규 제정, 국제 협력, 기구 지원 등)" value={psaSocial} onChange={e=>setPsaSocial(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" rows="2"></textarea>
                      <textarea placeholder="3. 개인적 차원 해결방안 (세계시민의식, 일상 속 실천 방안 등)" value={psaPersonal} onChange={e=>setPsaPersonal(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" rows="2"></textarea>
                      <input type="text" placeholder="4. 핵심 슬로건 (사람들의 시선을 끌 메인 카피 한 줄)" value={psaSlogan} onChange={e=>setPsaSlogan(e.target.value)} className="w-full p-3 border rounded-lg font-bold focus:ring-2 focus:ring-amber-500"/>
                      <textarea placeholder="5. 시각적 장면 구성 (어떤 이미지나 아이콘, 배경을 사용할 것인지 묘사)" value={psaVisuals} onChange={e=>setPsaVisuals(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" rows="2"></textarea>
                    </div>

                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                      <h3 className="font-bold text-emerald-900 mb-2"><i className="fas fa-leaf"></i> 세계시민으로서 나의 다짐</h3>
                      <input type="text" placeholder="인권 문제 해결을 위해 내가 실천할 수 있는 다짐 한 줄..." value={pledge} onChange={e=>setPledge(e.target.value)} className="w-full p-3 border rounded-lg font-bold focus:ring-2 focus:ring-emerald-500"/>
                    </div>

                    <div className="flex justify-between pt-4 border-t">
                      <button onClick={()=>setStep(2)} className="px-6 py-2 bg-slate-100 rounded-lg font-bold">이전</button>
                      <div className="flex gap-2">
                        {isEditing && <button onClick={()=>setIsEditing(false)} className="px-6 py-2 bg-slate-200 rounded-lg font-bold">수정 취소</button>}
                        <button onClick={handleSubmit} disabled={isSubmitting} className="px-8 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow hover:bg-indigo-700 disabled:opacity-50">
                          {isSubmitting ? '제출 중...' : (isEditing ? '수정 완료' : '최종 제출')}
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
